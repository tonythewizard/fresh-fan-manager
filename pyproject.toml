[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-fan-manager"
version = "2.0.0"
requires-python = ">=3.9"
description = "Universal cooling and hardware telemetry suite for Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Antonio Gullotta", email = "antonio@freshlinux.org" }
]
keywords = ["fan", "cooling", "hardware", "sensors", "thinkpad", "asus", "dell", "applesmc", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Monitoring",
]
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5,<7.0",
]

[project.scripts]
fresh-fan-manager = "fresh_fan_manager:main"

[project.urls]
Homepage = "https://github.com/tonythewizard/fresh-fan-manager"
Repository = "https://github.com/tonythewizard/fresh-fan-manager"

[tool.setuptools]
py-modules = ["fresh_fan_manager"]
packages = ["core", "ui"]
