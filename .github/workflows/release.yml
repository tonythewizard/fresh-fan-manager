name: Release Packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - core/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        shell: bash
        run: |
          VERSION=$(python3 -c 'from core.version import __version__; print(__version__)')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag does not match core/version.py" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          test -f "docs/releases/v$VERSION.md"

  tests:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - run: python -m pip install '.[gui]'
      - run: make test PYTHON=python

  deb:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev binutils gcc xz-utils
      - run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  arch:
    needs: tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v4
      - name: Build as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- make arch
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  rpm:
    needs: tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y gcc make rpm-build python3 tar gzip findutils binutils git
      - uses: actions/checkout@v4
      - run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  python:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, deb, arch, rpm, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        run: |
          test -n "$(find release-artifacts -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)"
          cd release-artifacts
          sha256sum * > SHA256SUMS
      - name: Publish release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Fresh Fan Manager $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
